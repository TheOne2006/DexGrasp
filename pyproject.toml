[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epic-dexgrasp"
version = "0.1.0"
description = "Scene-conditioned Sharpa keypoint Flow Matching and FlowMap distillation"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24,<2", "h5py>=3.9", "scipy>=1.10"]

[project.optional-dependencies]
mesh = ["trimesh>=4"]

[project.scripts]
dexgrasp = "dexgrasp.__main__:main"

[tool.setuptools.packages.find]
include = ["dexgrasp", "dexgrasp.*"]
