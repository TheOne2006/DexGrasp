[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dexgrasp-simulation"
version = "1.3.1"
description = "Dexonomy V1.3.1 mixed-object GPU grasp synthesis, ending at six-direction stability"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.5.1,<3",
    "numpy==2.3.1",
    "scipy>=1.15.3,<2",
    "mujoco>=3.12,<3.18",
    "mujoco-warp>=3.12,<3.18",
    "warp-lang>=1.16,<1.20",
    "trimesh>=4.5.3,<5",
    "imageio>=2.37,<3",
    "qpsolvers[clarabel]>=4.13,<5",
    "clarabel==0.11.1",
    "transforms3d==0.4.2",
    "hydra-core>=1.3.8,<1.4",
    "ruamel.yaml>=0.19.1,<0.20",
]

[project.scripts]
dexgrasp-generate = "dexonomy.generation:main"
dexgrasp-diversity = "dexonomy.diversity.__main__:main"

[tool.setuptools.packages.find]
include = ["dexonomy*"]

[tool.setuptools.package-data]
dexonomy = ["config/*.yaml", "config/*.json", "config/hand/*.yaml", "config/op/*.yaml"]

"dexonomy.diversity" = ["resources/*.json", "resources/*.txt"]
