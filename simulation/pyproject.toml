[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dexgrasp-simulation"
version = "1.3.1"
description = "Dexonomy V1.3.1 mixed-object GPU grasp synthesis, ending at six-direction stability"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.5.1,<2.8",
    "numpy==2.2.6",
    "scipy==1.15.3",
    "mujoco==3.17.0",
    "mujoco-warp==3.17.0",
    "warp-lang==1.16.0",
    "trimesh==4.5.3",
    "imageio==2.37.0",
    "qpsolvers[clarabel]==4.8.0",
    "clarabel==0.11.1",
    "transforms3d==0.4.2",
    "hydra-core==1.3.2",
    "ruamel.yaml==0.18.10",
]

[project.scripts]
dexgrasp-generate = "dexonomy.generation:main"

[tool.setuptools.packages.find]
include = ["dexonomy*"]

[tool.setuptools.package-data]
dexonomy = ["config/*.yaml", "config/*.json", "config/hand/*.yaml", "config/op/*.yaml"]
